<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Shock recognition and immediate response</title>
  <desc id="desc">A flow chart showing red flags, emergency activation, airway and breathing checks, bleeding control, neurological check, insulation, and repeated reassessment.</desc>
  <defs><style>
    .bg{fill:#0c0e11}.box{fill:#171b1f;stroke:#3d474e;stroke-width:2}.red{fill:#421f24;stroke:#b4515b;stroke-width:2}.green{fill:#183a2a;stroke:#4c986b;stroke-width:2}.t{fill:#f2f3f4;font:700 18px system-ui,sans-serif}.s{fill:#c3cbd0;font:15px system-ui,sans-serif}.a{fill:none;stroke:#909ba2;stroke-width:3}
  </style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#909ba2"/></marker></defs>
  <rect class="bg" width="960" height="600" rx="22"/>
  <text class="t" x="40" y="44">SUSPECT SHOCK: ACT EARLY</text>
  <rect class="red" x="70" y="72" width="820" height="80" rx="14"/><text class="t" x="112" y="104">RED FLAGS</text><text class="s" x="112" y="131">Cool/clammy skin • rapid weak pulse • fast breathing • anxiety/confusion • significant mechanism or blood loss</text>
  <path class="a" marker-end="url(#m)" d="M480 152V190"/>
  <rect class="box" x="330" y="192" width="300" height="60" rx="14"/><text class="t" x="375" y="228">CALL / PLAN EVACUATION</text>
  <path class="a" marker-end="url(#m)" d="M480 252V286"/>
  <rect class="box" x="55" y="290" width="190" height="116" rx="14"/><text class="t" x="78" y="322">A / B</text><text class="s" x="78" y="350">Open airway</text><text class="s" x="78" y="374">Support breathing</text><text class="s" x="78" y="398">Check chest injury</text>
  <rect class="red" x="275" y="290" width="190" height="116" rx="14"/><text class="t" x="298" y="322">C: BLEEDING</text><text class="s" x="298" y="350">Direct pressure</text><text class="s" x="298" y="374">Pack + bandage</text><text class="s" x="298" y="398">Tourniquet if needed</text>
  <rect class="box" x="495" y="290" width="190" height="116" rx="14"/><text class="t" x="518" y="322">D: DISABILITY</text><text class="s" x="518" y="350">Check alertness</text><text class="s" x="518" y="374">Watch for decline</text><text class="s" x="518" y="398">Consider anaphylaxis</text>
  <rect class="green" x="715" y="290" width="190" height="116" rx="14"/><text class="t" x="738" y="322">E: INSULATE</text><text class="s" x="738" y="350">Protect from ground</text><text class="s" x="738" y="374">Cover head/body</text><text class="s" x="738" y="398">Keep dry</text>
  <path class="a" d="M480 286H150V290M480 286H370V290M480 286H590V290M480 286H810V290"/>
  <path class="a" marker-end="url(#m)" d="M150 406V454H480M370 406V454M590 406V454M810 406V454H480"/>
  <rect class="green" x="240" y="458" width="480" height="78" rx="14"/><text class="t" x="302" y="489">REASSESS EVERY 2–3 MINUTES</text><text class="s" x="291" y="516">Mental status • pulse • breathing • skin • bleeding control</text>
  <text class="s" x="92" y="575">Educational field reference—not a substitute for certified training or emergency medical care.</text>
</svg>
